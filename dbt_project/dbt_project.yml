name: 'laptop_analytics'
version: '1.0.0'
config-version: 2

profile: 'laplaptech_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  laptop_analytics:
    staging:
      +materialized: view         # Tầng staging nên là view để tiết kiệm dung lượng
    intermediate:
      +materialized: view
    marts:
      +materialized: table        # Tầng marts lưu thành table trên SQL Server để truy vấn nhanh